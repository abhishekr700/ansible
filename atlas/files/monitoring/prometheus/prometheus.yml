# Managed by Ansible (atlas/setup-monitoring.yaml). Prometheus on atlas: homelab backup metrics for v1.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Pushed metrics keep their own job/host/backup labels (job="homelab_backup"). Without honor_labels they'd
  # become exported_job/exported_instance.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
