---
# Reclaim docker space and cap the systemd journal on atlas.
# Run from the repo root, dry run first: ansible-playbook -i inventory.yaml atlas/setup-atlas-disk-cleanup.yaml --check --diff
# Prunes build cache and unused images only; containers, networks and volumes are untouched.
- name: Atlas disk cleanup
  hosts: atlas
  become: true
  vars:
    journal_max_use: "{{ atlas_journal_max_use | default('1G') }}"
  tasks:
    - name: Prune docker build cache and unused images
      community.docker.docker_prune:
        builder_cache: true
        images: true
        images_filters:
          dangling: false
        containers: false
        networks: false
        volumes: false
      register: docker_prune_result

    - name: Show reclaimed docker space
      ansible.builtin.debug:
        msg: "Docker reclaimed {{ (docker_prune_result.builder_cache_space_reclaimed | default(0) + docker_prune_result.images_space_reclaimed | default(0)) | human_readable }}"

    - name: Ensure journald drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        mode: "0755"

    - name: Cap persistent journal size
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/size.conf
        mode: "0644"
        content: |
          [Journal]
          SystemMaxUse={{ journal_max_use }}
      notify: Restart journald

    - name: Vacuum existing journal down to the cap
      ansible.builtin.command: journalctl --vacuum-size={{ journal_max_use }}
      register: vacuum
      changed_when: "'freed 0B' not in vacuum.stderr and 'freed 0B' not in vacuum.stdout"

  handlers:
    - name: Restart journald
      ansible.builtin.systemd:
        name: systemd-journald
        state: restarted
