---
- name: Setup Atlas
  hosts: atlas
  gather_facts: true
  roles:
    - debian-shell-utilities
    - debian-install-docker

  tasks:
    - name: Install additional tools
      ansible.builtin.include_tasks: setup-atlas-tools.yaml

    - name: Setup Atlas crons
      ansible.builtin.include_tasks: setup-atlas-crons.yaml

    - name: Setup Atlas firewall
      ansible.builtin.include_tasks: setup-atlas-firewall.yaml

    - name: Setup Atlas as a Tailscale exit node
      ansible.builtin.include_tasks:
        file: setup-atlas-tailscale.yaml
        apply:
          tags: tailscale
      tags: tailscale

# - name: Setup Caddy
#   ansible.builtin.import_playbook: setup-caddy.yaml

- name: Setup Fail2ban
  ansible.builtin.import_playbook: setup-atlas-fail2ban.yaml
  tags: fail2ban

- name: Setup Foodies App
  ansible.builtin.import_playbook: setup-foodies-app.yaml
  tags: foodies-app
