---
atlas_project_folder: "/home/ubuntu/projects"
atlas_containers_folder: "/opt/containers"

# foodies-app: image from GitLab CI. `main` floats; WUD deploys each new build of it (digest watch).
# Rollback: set a `main-<short sha>` here and run the foodies-app tag (WUD ignores it: no digest changes on a sha
# tag). Set it back to `main` once a fixed build is out.
foodies_app_image: "registry.gitlab.com/abhishekr700/foodies-app"
foodies_app_image_tag: "main"
foodies_app_registry_user: "atlas-registry-pull"
foodies_app_bind_address: "172.17.0.1"

# WUD (What's Up Docker): watches foodies-app only. UI: Pangolin -> 172.17.0.1:3009, tailnet -> http://atlas:3009.
wud_version: "9.8.0"
wud_image_digest: "sha256:5a45a94c2c3e9c26e052c62bbc5bef9f945e3f7826dc446b5c71586a1238ed40"
wud_bind_address: "172.17.0.1"
wud_port: 3009
wud_watch_cron: "*/5 * * * *"

atlas_crons_folder: "/opt/crons"
atlas_cron_logs_dir: "/var/log/crons"

atlas_backup_cron: "atlas_backup.sh"
atlas_backup_cron_log_dir: "atlas-backup-cron"

atlas_backup_sync_to_cloud_cron: "atlas_backup_sync_to_cloud.sh"
atlas_backup_sync_to_cloud_cron_log_dir: "atlas-backup-sync-to-cloud-cron"

# Weekly docker prune (build cache + unused images older than the keep window; volumes/containers untouched)
atlas_docker_prune_weekday: "0"
atlas_docker_prune_hour: "3"
atlas_docker_prune_minute: "0"
atlas_docker_prune_keep: "168h"

# Journald size cap (used by atlas/setup-atlas-disk-cleanup.yaml)
atlas_journal_max_use: "1G"

# Fail2ban configuration parameters
fail2ban_bantime: "1h"
fail2ban_findtime: "10m"
fail2ban_maxretry: 5
fail2ban_banaction: "iptables-multiport"
fail2ban_banaction_allports: "iptables-multiport"
fail2ban_ignoreip: "127.0.0.1/8 ::1 100.64.0.0/10 192.168.0.0/16"

# Tailscale exit node
atlas_uplink_interface: "enp0s6"

# Monitoring (atlas/setup-monitoring.yaml): Prometheus + Pushgateway + Grafana for homelab backup metrics.
# Images pinned by version and digest (multi-arch index; atlas is arm64). Bump each pair together.
prometheus_version: "v3.15.1"
prometheus_image_digest: "sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2"
pushgateway_version: "v1.11.5"
pushgateway_image_digest: "sha256:bf6442633f6129d3e3f9861fa14c77bc012d74b33a1dd213d7b458b89ce3cc5d"
grafana_version: "13.2.5"
grafana_image_digest: "sha256:9f7aa1e1e3246aade5792d35a738049f7f32f89cd51d1956cf426a4e86268a84"
prometheus_retention: "90d"
# Loopback only (Docker bypasses ufw). Tailnet access is `tailscale serve` -> these binds.
monitoring_bind_address: "127.0.0.1"
prometheus_port: 9090
pushgateway_port: 9091
grafana_port: 3010
# MagicDNS name. tailscale serve routes by Host, so clients must use this name, not the Tailscale IP.
atlas_tailnet_fqdn: "atlas.taila8099.ts.net"
# Backups that must report; any of them with no data at all is red (homelab:backup_status).
monitoring_expected_backups:
  - { host: proxmox-blr-ws, backup: photos_borg, kind: borg, target: local-zfs }
  - { host: proxmox-blr-ws, backup: photos_gdrive_sync, kind: rclone, target: gdrive }
