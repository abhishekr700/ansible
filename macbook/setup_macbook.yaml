---
- name: Setup Mac
  hosts: macbook-local
  vars:
    zshrc_path: ~/.zshrc

  roles:
    - git-setup

  tasks:
    - name: Install Terminal Utilities
      import_tasks: mac_install_terminal_utils.yaml
    - name: Install Oh My Zsh Plugins
      import_tasks: mac_install_oh_my_zsh_plugins.yaml
    - name: Install Applications
      import_tasks: mac_install_applications.yaml
    - name: Install Ansible
      import_tasks: mac_setup_ansible.yaml
    - name: Configure zsh history in .zshrc
      tags: zshrc
      ansible.builtin.blockinfile:
        path: "{{ zshrc_path }}"
        append_newline: true
        prepend_newline: true
        block: |
          # https://www.baeldung.com/linux/bash-histsize-vs-histfilesize
          # Max lines stored in history file
          export HISTFILESIZE=10000
          # Max lines stored in memory in a session. Intially loaded from HISTFILE
          export HISTSIZE=5000

          # Ignore duplicate commands and commands starting with a space
          setopt HIST_IGNORE_ALL_DUPS  # Remove all previous entries of a duplicated command
          setopt HIST_IGNORE_SPACE     # Ignore commands that start with a space
          # zsh sessions will append their history list to the history file, rather than replace it.
          # Thus, multiple parallel zsh sessions will all have the new entries from their history
          # lists added to the history file, in the order that they exit.
          setopt APPEND_HISTORY        # Append history instead of overwriting
    # oh-my-zsh must be sourced once, from this block. A second, earlier source
    # (from the stock template) makes compinit rebuild its dump on every start.
    - name: Remove the stock oh-my-zsh source line (sourced in the plugins block)
      tags: zshrc
      ansible.builtin.lineinfile:
        path: "{{ zshrc_path }}"
        regexp: '^source \$ZSH/oh-my-zsh\.sh$'
        state: absent
    - name: Enable oh-my-zsh plugins
      tags: zshrc
      ansible.builtin.blockinfile:
        path: "{{ zshrc_path }}"
        append_newline: true
        prepend_newline: true
        marker: "# {mark} ANSIBLE MANAGED BLOCK FOR OH-MY-ZSH PLUGINS"
        # marker_begin: oh-my-zsh plugins
        # marker_end: oh-my-zsh plugins
        block: |
          plugins=(
            # other plugins...
            git
            zsh-autosuggestions
            zsh-completions
            fzf
            zsh-syntax-highlighting # This must be the last plugin for it's functionality
          )
          source $ZSH/oh-my-zsh.sh # Must be sourced after the plugins list
    - name: Useful Aliases for Macbook
      tags: zshrc
      ansible.builtin.blockinfile:
        path: "{{ zshrc_path }}"
        append_newline: true
        prepend_newline: true
        marker: "# {mark} ANSIBLE MANAGED BLOCK FOR aliases"
        block: |
          alias flushDnsCache="sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder; echo DNS Cache Cleared!"
          alias ls="ls -alh"
    # Hand-added init lines, moved into the shell-init block below.
    - name: Remove unmanaged shell init lines from .zshrc
      tags: zshrc
      ansible.builtin.lineinfile:
        path: "{{ zshrc_path }}"
        regexp: "{{ item }}"
        state: absent
      loop:
        - '^eval \$\(thefuck --alias\)$'
        - '^eval "\$\(zoxide init --cmd cd zsh\)"$'
        - '^autoload -U promptinit; promptinit$'
        - '^prompt pure$'
    - name: Collapse repeated Antigravity PATH lines in .zshrc
      tags: zshrc
      ansible.builtin.replace:
        path: "{{ zshrc_path }}"
        regexp: '(# Added by Antigravity\nexport PATH="[^"]*/\.antigravity/antigravity/bin:\$PATH"\n)(\n?\1)+'
        replace: '\1'
    # zoxide warns unless it is initialised after everything that touches its
    # hooks (oh-my-zsh), so this block goes at the end of the file.
    - name: Shell init (prompt, thefuck, zoxide) at the end of .zshrc
      tags: zshrc
      ansible.builtin.blockinfile:
        path: "{{ zshrc_path }}"
        append_newline: true
        prepend_newline: true
        insertafter: EOF
        marker: "# {mark} ANSIBLE MANAGED BLOCK FOR SHELL INIT (keep last)"
        block: |
          autoload -U promptinit && promptinit
          prompt pure  # theme
          # thefuck starts Python (~0.5s), so load it on first use
          fuck() { unfunction fuck; eval "$(thefuck --alias)"; fuck "$@"; }
          eval "$(zoxide init --cmd cd zsh)"  # must stay last
