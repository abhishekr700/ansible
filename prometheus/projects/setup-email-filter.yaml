---
- name: Setup Email Filter Script
  hosts: nas
  vars:
    project_location_nas: "{{nas_projects_folder}}/emailFilterScript"
  tasks:
    - name: Setup email filter
      vars:
        project_location: "{{ project_location_nas }}"
        env_file_name: "emailFilter.env"
        use_docker: true
      ansible.builtin.include_tasks: ../../projects/tasks/setup-email-filter.yaml
