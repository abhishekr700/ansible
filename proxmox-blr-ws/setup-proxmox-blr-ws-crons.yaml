---
- name: Setup Proxmox BLR WS crons
  hosts: proxmox-blr-ws
  tasks:
    - name: "Ensure cron and related directories exist"
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ proxmox_blr_ws_crons_folder }}"
        - "{{ proxmox_blr_ws_cron_logs_dir }}"
        - "{{ proxmox_blr_ws_cron_logs_dir }}/{{ proxmox_blr_ws_backup_cron_log_dir }}"
        - "{{ proxmox_blr_ws_cron_logs_dir }}/{{ proxmox_blr_ws_backup_sync_gdrive_cron_log_dir }}"

    - name: Copy cron files
      become: true
      ansible.builtin.copy:
        src: "{{ local_crons_folder }}/{{ item.script }}"
        dest: "{{ proxmox_blr_ws_crons_folder }}/{{ item.script }}"
        mode: "0744"
        backup: false
      loop:
        - { name: "Proxmox BLR WS photos backup cron", script: "{{ proxmox_blr_ws_backup_cron }}" }
        - { name: "Proxmox BLR WS photos backup sync gdrive cron", script: "{{ proxmox_blr_ws_backup_sync_gdrive_cron }}" }

    # backup-run wraps the backup scripts and pushes their status to the Pushgateway on atlas (metrics contract
    # v1). It never changes a backup's outcome: it exits with the script's own code and ignores push failures.
    - name: Install the backup-run wrapper
      become: true
      ansible.builtin.copy:
        src: files/backup-run
        dest: /usr/local/bin/backup-run
        owner: root
        group: root
        mode: "0755"

    - name: Configure backup-run
      become: true
      ansible.builtin.copy:
        dest: /etc/backup-run.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible (proxmox-blr-ws/setup-proxmox-blr-ws-crons.yaml). Read by /usr/local/bin/backup-run.
          # Environment variables of the same name win over these.
          BACKUP_RUN_PUSHGATEWAY_URL="${BACKUP_RUN_PUSHGATEWAY_URL:-{{ backup_run_pushgateway_url }}}"
          BACKUP_RUN_HOST="${BACKUP_RUN_HOST:-{{ inventory_hostname }}}"

    - name: Add cron job to crontab
      become: true
      ansible.builtin.cron:
        name: "{{ item.name }}"
        minute: "{{ item.minute }}"
        hour: "{{ item.hour }}"
        # Same log file and systemd-cat as before; backup-run only sits in front of the script.
        job: >
          /usr/local/bin/backup-run --backup {{ item.backup }} --kind {{ item.kind }} --target {{ item.target }}
          --interval {{ item.interval }} --
          {{ proxmox_blr_ws_crons_folder }}/{{ item.script }} 2>&1 |
          tee -a {{ proxmox_blr_ws_cron_logs_dir }}/{{ item.log_dir }}/$(date +\%Y-\%m-\%d_\%H-\%M-\%S).log |
          systemd-cat -t "{{ item.name }}"
        state: present
      loop:
        - {
            name: "Proxmox BLR WS photos backup cron",
            minute: "0",
            hour: "*/3",
            script: "{{ proxmox_blr_ws_backup_cron }}",
            log_dir: "{{ proxmox_blr_ws_backup_cron_log_dir }}",
            backup: "photos_borg",
            kind: "borg",
            target: "local-zfs",
            interval: 10800,
          }
        - {
            name: "Proxmox BLR WS photos backup sync gdrive cron",
            minute: "30",
            hour: "*/3",
            script: "{{ proxmox_blr_ws_backup_sync_gdrive_cron }}",
            log_dir: "{{ proxmox_blr_ws_backup_sync_gdrive_cron_log_dir }}",
            backup: "photos_gdrive_sync",
            kind: "rclone",
            target: "gdrive",
            interval: 10800,
          }

    - name: Add log cleanup cron job
      become: true
      ansible.builtin.cron:
        name: "Proxmox BLR WS cron log cleanup"
        minute: "0"
        hour: "1"
        job: 'find {{ proxmox_blr_ws_cron_logs_dir }} -name "*.log" -type f -mtime +14 -delete'
        state: present
