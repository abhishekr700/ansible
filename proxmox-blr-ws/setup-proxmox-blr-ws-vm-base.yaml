---
# Reusable inputs for cloud-init VMs on proxmox-blr-ws (not specific to any one VM):
#  - `snippets` content on the `local` storage, so VMs can use custom cloud-init user-data
#  - the pinned Debian 13 cloud image in local:import, used by terraform/proxmox-blr-ws/debian13-template
# Image pin lives in host_vars/proxmox-blr-ws.yml; keep it in sync with the template's variables.tf.
- name: Setup VM base inputs on proxmox-blr-ws
  hosts: proxmox-blr-ws
  tasks:
    # No Ansible module manages PVE storage content types, so read with pvesh and only
    # call pvesm when `snippets` is missing. Existing content types are kept.
    - name: Read content types of the local storage
      ansible.builtin.command: pvesh get /storage/local --output-format json
      register: local_storage
      changed_when: false
      check_mode: false # read-only, so --check can show the real diff

    - name: Add snippets content type to the local storage
      ansible.builtin.command: >-
        pvesm set local --content
        {{ ((local_storage.stdout | from_json).content.split(',') + ['snippets']) | join(',') }}
      when: "'snippets' not in (local_storage.stdout | from_json).content.split(',')"
      changed_when: true

    - name: Ensure snippets and import directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /var/lib/vz/snippets
        - /var/lib/vz/import

    - name: Download pinned Debian 13 cloud image
      ansible.builtin.get_url:
        url: "{{ debian13_image_url }}"
        dest: "/var/lib/vz/import/{{ debian13_image_name }}"
        checksum: "sha512:{{ debian13_image_sha512 }}"
        mode: "0644"
