---
- name: Setup projects LXC
  hosts: sindri
  roles:
    - git-setup
  tasks:
    - name: Create projects directory
      ansible.builtin.file:
        path: "{{ projects_location }}"
        state: directory
        mode: '0755'

    - name: Setup Docker Networks
      ansible.builtin.include_tasks: setup-docker-networks.yaml

- name: Import Expense Tracker Playbook
  import_playbook: setup-expense-tracker.yaml
